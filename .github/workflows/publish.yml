name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # necessário para o Trusted Publishing (OIDC) do npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # garante npm >= 11.5.1, exigido pelo OIDC
      - run: npm ci
      - run: npm run build
      - run: npm publish
